# Replica: follow the writer's local replica directory over read-only SFTP (one SSH connection,
# polled every second; no per-request cost). PRIMARY_SSH and PRIMARY_HOST_KEY come from
# /etc/platform/litestream-primary.env (role.sh); the host key is pinned.
dbs:
  - path: /data/mc-hub.db
    replica:
      type: sftp
      host: ${PRIMARY_SSH}
      user: platform-sync
      key-path: /etc/litestream/sync_key
      host-key: ${PRIMARY_HOST_KEY}
      path: /litestream/mc-hub-api${LTX_SUFFIX}
