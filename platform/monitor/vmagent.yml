# What every node's vmagent scrapes (all on loopback; vmagent adds node=<host id> when it pushes).
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: node
    static_configs: [{targets: ["127.0.0.1:9100"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["127.0.0.1:18081"]}]
    metric_relabel_configs:
      # Containers only (not every cgroup), by name.
      - {source_labels: [name], regex: "", action: drop}
  # Traefik's metrics entrypoint, published on loopback by the edge stack.
  - job_name: traefik
    static_configs: [{targets: ["127.0.0.1:18082"]}]
