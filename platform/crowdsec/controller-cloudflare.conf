# /etc/systemd/system/crowdsec-telegram-controller.service.d/cloudflare.conf: the edge list sync.
[Service]
LoadCredential=cloudflare-api-token:/etc/crowdsec-telegram-controller/secrets/cloudflare-api-token
LoadCredential=cloudflare-lapi-key:/etc/crowdsec-telegram-controller/secrets/cloudflare-lapi-key
ExecCondition=+/opt/platform/crowdsec/lapi.sh permit
TimeoutStopSec=15s
