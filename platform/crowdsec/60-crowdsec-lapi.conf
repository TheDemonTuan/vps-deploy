# /etc/ssh/sshd_config.d/60-crowdsec-lapi.conf on the LAPI node (root 0600, ansible/).
# The other nodes' crowdsec-lapi.service forwards their 172.31.254.1:8080 here: nothing else.
Match User crowdsec-lapi
    AuthorizedKeysFile /etc/ssh/crowdsec-lapi.keys
    AllowTcpForwarding local
    PermitOpen 172.31.254.1:8080
    PermitListen none
    ForceCommand /sbin/nologin
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
