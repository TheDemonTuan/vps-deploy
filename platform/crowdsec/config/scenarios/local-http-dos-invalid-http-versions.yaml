type: trigger
format: 2.0
name: local/http-dos-invalid-http-versions
description: Detect DoS tools using invalid HTTP versions
filter: (evt.Meta.log_type in ["http_access-log", "http_error-log"] && evt.Parsed.http_version
  != "" && evt.Parsed.http_version not in ["0.9", "1.0", "1.1", "2.0", "3.0"]) &&
  evt.Meta.log_type == 'http_access-log' && (evt.Meta.target_fqdn in ['tuannguyenviet.site',
  'transactions.tuannguyenviet.site']) && evt.Meta.http_path != '' && evt.Meta.http_path
  != '/api' && !(evt.Meta.http_path startsWith '/api/') && !(evt.Meta.http_path startsWith
  '/v1/') && !(evt.Meta.http_path startsWith '/webhooks/') && !(evt.Meta.http_path
  startsWith '/assets/') && !(evt.Meta.http_path startsWith '/_next/') && !(evt.Meta.http_path
  startsWith '/crowdsec-internal/') && !(evt.Meta.http_path startsWith '/health')
groupby: evt.Meta.source_ip
blackhole: 2m
labels:
  service: http
  remediation: true
  confidence: 2
  spoofable: 0
  classification:
  - attack.T1498
  behavior: http:dos
  label: HTTP DOS with invalid HTTP version
