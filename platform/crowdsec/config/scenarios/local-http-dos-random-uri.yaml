type: leaky
format: 2.0
name: local/http-dos-random-uri
description: Detect DoS tools using random uri
filter: '(evt.Meta.log_type == "http_access-log" &&

  evt.Meta.http_verb == ''GET'' &&

  evt.Parsed.static_ressource == ''false'' &&

  Upper(evt.Parsed.file_frag) == evt.Parsed.file_frag &&

  len(evt.Parsed.file_frag) == 6 &&

  int(evt.Meta.http_args_len) == 0) && evt.Meta.log_type == ''http_access-log'' &&
  (evt.Meta.target_fqdn in [''tuannguyenviet.site'', ''transactions.tuannguyenviet.site''])
  && evt.Meta.http_path != '''' && evt.Meta.http_path != ''/api'' && !(evt.Meta.http_path
  startsWith ''/api/'') && !(evt.Meta.http_path startsWith ''/v1/'') && !(evt.Meta.http_path
  startsWith ''/webhooks/'') && !(evt.Meta.http_path startsWith ''/assets/'') && !(evt.Meta.http_path
  startsWith ''/_next/'') && !(evt.Meta.http_path startsWith ''/crowdsec-internal/'')
  && !(evt.Meta.http_path startsWith ''/health'')'
capacity: 30
leakspeed: 1s
groupby: evt.Meta.source_ip
blackhole: 2m
labels:
  confidence: 2
  spoofable: 0
  classification:
  - attack.T1498
  behavior: http:dos
  label: HTTP DOS via random URI
  service: http
  remediation: true
