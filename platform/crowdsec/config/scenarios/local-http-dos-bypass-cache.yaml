type: leaky
name: local/http-dos-bypass-cache
description: Detect DoS tools bypassing cache every request
filter: (evt.Meta.log_type == 'http_access-log' && evt.Meta.http_args_len != '' &&
  int(evt.Meta.http_args_len) >= 7 && int(evt.Meta.http_args_len) <= 12 && evt.Parsed.http_args
  matches '^[0-9]+$' && evt.Parsed.static_ressource == 'false') && evt.Meta.log_type
  == 'http_access-log' && (evt.Meta.target_fqdn in ['tuannguyenviet.site', 'transactions.tuannguyenviet.site'])
  && evt.Meta.http_path != '' && evt.Meta.http_path != '/api' && !(evt.Meta.http_path
  startsWith '/api/') && !(evt.Meta.http_path startsWith '/v1/') && !(evt.Meta.http_path
  startsWith '/webhooks/') && !(evt.Meta.http_path startsWith '/assets/') && !(evt.Meta.http_path
  startsWith '/_next/') && !(evt.Meta.http_path startsWith '/crowdsec-internal/')
  && !(evt.Meta.http_path startsWith '/health')
distinct: evt.Parsed.http_args
leakspeed: 1s
capacity: 30
cache_size: 10
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  service: http
  remediation: true
  confidence: 2
  spoofable: 0
  classification:
  - attack.T1498
  behavior: http:dos
  label: HTTP DOS with cache bypass
