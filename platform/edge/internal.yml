# Copy to /opt/platform/edge/dynamic/internal.yml on every node (with the "internal" entrypoint, README.md).
http:
  middlewares:
    # Same-node callers only: loopback, mc-hub and mc-hub-api app networks (never the tunnel network).
    internal-only:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "172.25.0.0/16"
          - "172.27.0.0/16"
        rejectStatusCode: 403
