# /etc/ssh/sshd_config.d/60-platform-sync.conf on every node (root 0600).
# The other nodes read this node's /srv/platform-sync over SFTP, read-only: the Litestream replica
# (a replica node follows the primary from it) and the CrowdSec decision export. Keys in
# /etc/ssh/platform-sync.keys carry restrict,from="<other node IP>".
Match User platform-sync
    AuthorizedKeysFile /etc/ssh/platform-sync.keys
    ChrootDirectory /srv/platform-sync
    ForceCommand internal-sftp -R
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
