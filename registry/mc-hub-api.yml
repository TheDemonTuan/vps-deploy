version: 1
app: mc-hub-api
host: oracle-main
# The SQLite writer stays on `host`; replica hosts open the Litestream copy read-only.
replica_hosts: [oracle-sg2]
caller:
  repository: TheDemonTuan/mc-hub-api
  ref: refs/heads/main
  config: .deploy/app.yml
  build_workflows: [deploy.yml]
  deploy_workflows: [deploy.yml]
manifest:
  version: 1
  app: mc-hub-api
  strategy: blue-green
  image: ghcr.io/thedemontuan/mc-hub-api
  platform: linux/arm64
  runtime: {port: 8080}
  health: {path: /healthz, timeout_seconds: 60}
  route: {timeout_seconds: 30}
runtime:
  allowed_env: [TURNSTILE_SITE_KEY, TURNSTILE_SECRET, MEDIA_S3_ENDPOINT, MEDIA_S3_BUCKET, MEDIA_S3_ACCESS_KEY_ID, MEDIA_S3_SECRET_ACCESS_KEY, EDGE_REPLAY_KEY]
  required_env: [TURNSTILE_SITE_KEY, TURNSTILE_SECRET, MEDIA_S3_ENDPOINT, MEDIA_S3_BUCKET, MEDIA_S3_ACCESS_KEY_ID, MEDIA_S3_SECRET_ACCESS_KEY]
route:
  generation_header: X-MC-Hub-API-Route-Generation
  required_middlewares: [deny-internal, tunnel-only, internal-only]
image_access: private
balance:
  # The API host serves deploy probes and fallback reads; anything that writes goes to the writer
  # (the holder of the edge lease, see mc-hub.yml).
  lease: mc-hub-api
  primary_paths: ['^/api/(admin|auth|push)/', '^/api/dl(/|$)']
