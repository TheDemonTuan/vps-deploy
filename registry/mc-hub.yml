version: 1
app: mc-hub
host: oracle-main
# Read copies behind the edge load balancer (cloudflare/edge-lb); `host` keeps the writes.
replica_hosts: [oracle-sg2]
caller:
  repository: TheDemonTuan/mc-hub
  ref: refs/heads/main
  config: .deploy/app.yml
  build_workflows: [deploy.yml]
  deploy_workflows: [deploy.yml]
manifest:
  version: 1
  app: mc-hub
  strategy: blue-green
  image: ghcr.io/thedemontuan/mc-hub
  platform: linux/arm64
  runtime: {port: 8080}
  health: {path: /healthz, timeout_seconds: 60}
  route: {timeout_seconds: 30}
runtime:
  allowed_env: []
  required_env: []
route:
  generation_header: X-MC-Hub-Route-Generation
  required_middlewares: [deny-internal, tunnel-only]
image_access: private
balance:
  # Writes, admin, login and single-use downloads go to the writer: the node holding mc-hub-api's
  # edge lease (registry `host` until a node runs platform/peer/role.sh promote). After a write the
  # client reads from it for sticky_seconds.
  lease: mc-hub-api
  primary_paths: ['^/admin(/|$)', '^/api/(admin|auth|push)/', '^/api/dl(/|$)']
  primary_cookies: [__Host-mch_session]
  sticky_seconds: 15
  # The admin's cache purge reaches the other nodes once replication has caught up.
  fanout:
    - {method: POST, path: '^/admin/revalidate$', delay_seconds: 8}
  # Readers' writes queued at the edge while the writer is down, replayed when it is back.
  queue_paths: ['^/api/posts/[^/]+/(views|comments|compat)$', '^/api/feedback$', '^/api/feedback/[0-9]+/vote$']
  # Public pages and post reads stay 30 s in the edge's Cache API (only responses marked public or
  # no-cache), and up to a day for when every node fails.
  edge_cache:
    paths: ['^/api/posts(/[^/]+)?$', '^/(?!api/|admin|_astro/|media/)']
    ttl_seconds: 30
    stale_seconds: 86400
  # Hashed build assets: the edge cache serves them; a miss tries every node (deploys reach the
  # nodes one after another, so one may not have a new build's files yet).
  immutable_paths: ['^/_astro/']
  # Public images come from R2 (mc-hub-api mirrors every upload there), as mc-hub-api serves them.
  public_bucket:
    binding: MEDIA
    bucket: mc-hub-media
    path: '^/media/[0-9a-f]{32}(-sm)?\.jpg$'
    strip: /media/
    key_prefix: media/
    headers:
      Cache-Control: 'public, max-age=31536000, immutable'
      Content-Type: image/jpeg
      X-Content-Type-Options: nosniff
      Content-Security-Policy: "default-src 'none'; sandbox"
