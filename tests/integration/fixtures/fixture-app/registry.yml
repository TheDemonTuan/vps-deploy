version: 1
app: fixture-app
host: fixture-local
caller:
  repository: Fixture/fixture-app
  ref: refs/heads/main
  config: .deploy/app.yml
  build_workflows: [deploy.yml]
  deploy_workflows: [deploy.yml]
manifest:
  version: 1
  app: fixture-app
  strategy: blue-green
  image: localhost:5000/fixture-app
  platform: linux/arm64
  runtime: {port: 20128}
  health: {path: /api/health, timeout_seconds: 60}
  route: {timeout_seconds: 30}
runtime:
  allowed_env: [INITIAL_PASSWORD]
  required_env: []
route:
  generation_header: X-Fixture-App-Route-Generation
  required_middlewares: [security-headers]
