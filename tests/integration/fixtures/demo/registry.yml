version: 1
app: demo
host: fixture-local
caller:
  repository: Fixture/demo
  ref: refs/heads/main
  config: .deploy/app.yml
  build_workflows: [deploy.yml]
  deploy_workflows: [deploy.yml]
manifest:
  version: 1
  app: demo
  strategy: blue-green
  image: localhost:5000/demo
  platform: linux/arm64
  runtime: {port: 18081}
  health: {path: /healthz, timeout_seconds: 60}
  route: {timeout_seconds: 30}
runtime:
  allowed_env: []
  required_env: []
route:
  generation_header: X-Demo-Route-Generation
  required_middlewares: [security-headers]
