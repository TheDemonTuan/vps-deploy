name: Deploy 9router on VPS
on:
  workflow_call:
    inputs:
      app: {required: true, type: string}
      component: {required: true, type: string}
      source-sha: {required: true, type: string}
      platform-ref: {required: true, type: string}
      config: {required: true, type: string}
      image-ref: {required: true, type: string}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    environment: production
    steps:
      - name: Reject untrusted caller before checkout
        env:
          CALLER_REPO: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          APP: ${{ inputs.app }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          [[ "$CALLER_REPO" == TheDemonTuan/9router && "$CALLER_REF" == refs/heads/master && "$APP" == 9router && "$CONFIG" == .deploy/app.yml ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" && "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          case "$COMPONENT" in
            app) [[ "$IMAGE_REF" =~ ^ghcr\.io/thedemontuan/9router@sha256:[0-9a-f]{64}$ ]] ;;
            rtk) [[ "$IMAGE_REF" =~ ^ghcr\.io/thedemontuan/rtk-sidecar@sha256:[0-9a-f]{64}$ ]] ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheDemonTuan/9router
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate immutable caller and profile
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
        run: python3 platform/scripts/check-caller.py deploy-vps.yml
      - name: Deploy with pinned host identity
        working-directory: source
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          IMAGE_REF: ${{ inputs.image-ref }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          umask 077
          sshdir="$(mktemp -d)"
          trap 'rm -rf "$sshdir"' EXIT
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$sshdir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$sshdir/known_hosts"
          ssh-keygen -lf "$sshdir/known_hosts" | cut -d' ' -f 2
          export DEPLOY_KEY_FILE="$sshdir/key" DEPLOY_KNOWN_HOSTS_FILE="$sshdir/known_hosts"
          python3 ../platform/scripts/ssh-request.py --operation deploy --component "$COMPONENT" --image "$IMAGE_REF" \
            --source-sha "$SOURCE_SHA" --platform-ref "$PLATFORM_REF" --config "$CONFIG" \
            --request-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${COMPONENT}"
