name: Build 9router image
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
      config:
        required: true
        type: string
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.smoke.outputs.image-ref }}
    steps:
      - name: Reject untrusted caller before checkout
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$CALLER_REPO" == TheDemonTuan/9router && "$CALLER_REF_TYPE" == branch && "$CONFIG" == .deploy/app.yml ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" && "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheDemonTuan/9router
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate checked out inputs
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
        run: python3 platform/scripts/check-caller.py build-docker.yml
      - name: Validate registered manifest contract
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'platform/lib')
          from core import manifest
          manifest(Path('source/.deploy/app.yml').read_bytes())
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable digest
        id: digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: source/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/thedemontuan/9router:sha-${{ inputs.source-sha }}
            ghcr.io/thedemontuan/9router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
          sbom: false
      - name: Smoke exact published image
        id: smoke
        working-directory: source
        env:
          IMAGE_REF: ghcr.io/thedemontuan/9router@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/thedemontuan/9router@sha256:[0-9a-f]{64}$ ]]
          bash .deploy/smoke-image.sh "$IMAGE_REF"
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
