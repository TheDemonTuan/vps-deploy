name: Build registered native image
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
      config:
        required: true
        type: string
      component:
        required: false
        type: string
        default: app
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.smoke.outputs.image-ref }}
    steps:
      - name: Reject mutable platform checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          COMPONENT: ${{ inputs.component }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" ]]
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
          [[ "$COMPONENT" =~ ^(app|cgw)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate registered caller before source checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          OPERATION: build
          COMPONENT: ${{ inputs.component }}
          IMAGE_REF: ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 platform/scripts/check-caller.py build-docker.yml --preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - name: Validate checked out caller and registered manifest
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          OPERATION: build
          COMPONENT: ${{ inputs.component }}
          IMAGE_REF: ''
        run: |
          set -euo pipefail
          python3 platform/scripts/check-caller.py build-docker.yml
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'platform/lib')
          from core import app_registration
          registration = app_registration(Path('platform'), os.environ['APP'])
          component = os.environ['COMPONENT']
          image = registration['manifest']['image'] if component == 'app' else registration['manifest']['cgw']['image']
          if not image.startswith('ghcr.io/') or registration['manifest']['platform'] != 'linux/arm64':
              raise SystemExit('unsupported production build policy')
          allowed_ref = registration['caller'].get('ref', 'refs/heads/master')
          caller_ref = os.environ.get('CALLER_REF', '')
          tags = [f"{image}:sha-{os.environ['SOURCE_SHA']}"]
          if component == 'app' and caller_ref == allowed_ref:
              tags.append(f"{image}:latest")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('REGISTERED_IMAGE=' + image + '\n')
              stream.write('DOCKER_TAGS=' + ','.join(tags) + '\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable digest
        id: digest
        if: inputs.component == 'app'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
          sbom: false
      - name: Fetch pinned official browser privately
        if: inputs.component == 'cgw'
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          package="$GITHUB_WORKSPACE/source/services/chatgpt-web-runtime"
          python3 "$package/scripts/install-browser.py" --manifest "$package/image-build-manifest.json" \
            --arch arm64 --output "$RUNNER_TEMP/cgw-browser"
      - name: Build native runtime for compatibility proof
        if: inputs.component == 'cgw'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/services/chatgpt-web-runtime/Dockerfile
          load: true
          push: false
          platforms: linux/arm64
          tags: cgw-runtime:proof-${{ inputs.source-sha }}
          build-args: APP_REVISION=${{ inputs.source-sha }}
          cache-from: type=gha,scope=cgw-runtime-arm64
          cache-to: type=gha,scope=cgw-runtime-arm64,mode=min,ignore-error=true
          provenance: false
          sbom: false
      - name: Prove compatibility and publish evidence-bearing runtime
        if: inputs.component == 'cgw'
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          package="$GITHUB_WORKSPACE/source/services/chatgpt-web-runtime"
          evidence="$RUNNER_TEMP/cgw-build-evidence"
          mkdir -m 0700 "$evidence"
          sudo chown 10001:10001 "$evidence"
          hardening=(--rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true
            --security-opt "seccomp=$package/security/seccomp.json" --shm-size 1g
            --mount "type=bind,src=$RUNNER_TEMP/cgw-browser,dst=/opt/cgw-browser,readonly"
            --tmpfs "/tmp:rw,nosuid,nodev,size=512m,mode=1777"
            --tmpfs "/run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700"
            --tmpfs "/data:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700")
          raw="cgw-runtime:proof-$SOURCE_SHA"
          docker run "${hardening[@]}" -v "$evidence:/evidence:rw" "$raw" \
            bun scripts/verify-harness-compatibility.ts /evidence/compatibility.json
          # Only generated build evidence enters the final layer; no runtime/account state.
          sudo chown "$(id -u):$(id -g)" "$evidence" "$evidence/compatibility.json"
          python3 - "$evidence/compatibility.json" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          flags = {'nativeToolLoop', 'namespacedTools', 'freeformTools', 'compatibilityV1',
                   'nestedSubagents', 'profileConcurrency', 'approvalOnceOnly', 'requestScopeIsolation'}
          assert set(evidence) == flags | {'protocolVersion', 'upstreamRevision'}
          assert type(evidence['protocolVersion']) is int and evidence['protocolVersion'] == 1
          assert evidence['upstreamRevision'] == 'fa2d2c6c24926078b46eedb2186f69f2e8d548d7'
          assert all(evidence[flag] is True for flag in flags)
          PY
          printf 'FROM %s\nCOPY --chown=10001:10001 compatibility.json /opt/cgw/compatibility.json\nLABEL org.opencontainers.image.revision="%s"\n' \
            "$raw" "$SOURCE_SHA" > "$evidence/Dockerfile"
          tag="$REGISTERED_IMAGE:sha-$SOURCE_SHA"
          # The native docker driver sees the loaded, tested local base without a mutable pull.
          docker buildx build --builder default --load --platform linux/arm64 -f "$evidence/Dockerfile" -t "$tag" "$evidence"
          [[ "$(docker image inspect "$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$SOURCE_SHA" ]]
          docker push "$tag"
          image_ref=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          [[ "$image_ref" =~ ^${REGISTERED_IMAGE}@sha256:[0-9a-f]{64}$ ]]
          echo "CGW_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
      - name: Smoke exact published image
        id: smoke
        working-directory: source
        env:
          IMAGE_REF: ${{ inputs.component == 'cgw' && env.CGW_IMAGE_REF || format('{0}@{1}', env.REGISTERED_IMAGE, steps.digest.outputs.digest) }}
          REGISTERED_IMAGE: ${{ env.REGISTERED_IMAGE }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^${REGISTERED_IMAGE}@sha256:[0-9a-f]{64}$ ]]
          if [[ "$COMPONENT" == app ]]; then
            bash .deploy/smoke-image.sh "$IMAGE_REF"
          else
            package="$GITHUB_WORKSPACE/source/services/chatgpt-web-runtime"
            hardening=(--rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true
              --security-opt "seccomp=$package/security/seccomp.json" --shm-size 1g
              --mount "type=bind,src=$RUNNER_TEMP/cgw-browser,dst=/opt/cgw-browser,readonly"
              --tmpfs "/tmp:rw,nosuid,nodev,size=512m,mode=1777"
              --tmpfs "/run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700"
              --tmpfs "/data:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700")
            docker run "${hardening[@]}" "$IMAGE_REF" bun scripts/image-smoke.ts --arch arm64
            docker run "${hardening[@]}" "$IMAGE_REF" bun scripts/smoke-offline.ts
          fi
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
