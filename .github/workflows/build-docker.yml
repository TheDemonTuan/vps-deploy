name: Build registered app image
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
      config:
        required: true
        type: string
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.smoke.outputs.image-ref }}
    steps:
      - name: Reject mutable platform checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" ]]
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate registered caller before source checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          OPERATION: build
          COMPONENT: app
          IMAGE_REF: ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 platform/scripts/check-caller.py build-docker.yml --preflight
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - name: Validate checked out caller and registered manifest
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          OPERATION: build
          COMPONENT: app
          IMAGE_REF: ''
        run: |
          set -euo pipefail
          python3 platform/scripts/check-caller.py build-docker.yml
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'platform/lib')
          from core import app_registration
          registration = app_registration(Path('platform'), os.environ['APP'])
          image = registration['manifest']['image']
          if not image.startswith('ghcr.io/') or registration['manifest']['platform'] != 'linux/arm64':
              raise SystemExit('unsupported production build policy')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('REGISTERED_IMAGE=' + image + '\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable digest
        id: digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          file: source/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTERED_IMAGE }}:sha-${{ inputs.source-sha }}
            ${{ env.REGISTERED_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
          sbom: false
      - name: Smoke exact published image
        id: smoke
        working-directory: source
        env:
          IMAGE_REF: ${{ env.REGISTERED_IMAGE }}@${{ steps.digest.outputs.digest }}
          REGISTERED_IMAGE: ${{ env.REGISTERED_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^${REGISTERED_IMAGE}@sha256:[0-9a-f]{64}$ ]]
          bash .deploy/smoke-image.sh "$IMAGE_REF"
          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
