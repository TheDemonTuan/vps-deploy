name: mc-hub Cloudflare cache
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Survey first; apply adds or repairs only the mc-hub public edge-cache rule
        type: choice
        required: true
        options: [survey, apply]
permissions:
  contents: read
concurrency:
  group: cloudflare-cache-rules
  cancel-in-progress: false
jobs:
  cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.operation == 'apply' && 'platform-admin' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify scoped cache-rule state transitions without credentials
        run: python3 -m unittest discover -s cloudflare/tests -p test_mc_hub_cache.py -v
      - name: Cache only mc-hub's public pages at the edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATION: ${{ inputs.operation }}
        run: python3 cloudflare/mc_hub_cache.py --operation "$OPERATION"
