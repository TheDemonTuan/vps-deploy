name: One-time Penpot dedicated residue teardown
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: penpot-ingress-production
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'TheDemonTuan/vps-deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remove empty dedicated cache ruleset and inspect legacy tunnel
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'cloudflare')
          from penpot_ingress import Client, HOST, ZONE, TUNNEL, Failure, inventory_list, active_connectors
          api = Client()
          zones = [item for item in api.get('/zones?name=' + ZONE + '&per_page=50') if item['name'] == ZONE and item['account']['id'] == api.account]
          assert len(zones) == 1
          base = '/zones/' + zones[0]['id']
          account = '/accounts/' + api.account
          shared_path = account + '/cfd_tunnel/' + TUNNEL + '/configurations'
          shared_before = api.get(shared_path)
          receipt = {'deleted_empty_cache_rulesets': [], 'legacy_tunnel_candidates': [], 'deleted_legacy_tunnels': [], 'blockers': []}
          cache_before = [item for item in api.get(base + '/rulesets?per_page=50') if item.get('phase') == 'http_request_cache_settings']
          for item in cache_before:
              detail = api.get(base + '/rulesets/' + item['id'])
              if detail.get('name') == 'Penpot cache settings' and detail.get('kind') == 'zone' and not detail.get('rules'):
                  try:
                      api.request('DELETE', base + '/rulesets/' + item['id'])
                  except Failure as error:
                      if str(error) != 'CLOUDFLARE_READ_FAILED':
                          raise
                      remaining = api.get(base + '/rulesets?per_page=50')
                      assert not any(current['id'] == item['id'] for current in remaining)
                  receipt['deleted_empty_cache_rulesets'].append(item['id'])
          cache_after = [item for item in api.get(base + '/rulesets?per_page=50') if item.get('phase') == 'http_request_cache_settings']
          assert [item['id'] for item in cache_after] == [item['id'] for item in cache_before if item['id'] not in receipt['deleted_empty_cache_rulesets']]
          receipt['cache_rulesets_remaining'] = [item['id'] for item in cache_after]
          receipt['original_penpot_cache_ruleset_absent'] = not any(item['id'] == 'de980db0bc53442e94cd4c5f146858cf' for item in cache_after)
          tunnel_list = account + '/cfd_tunnel?is_deleted=false&per_page=100'
          tunnels_before = inventory_list(api.get(tunnel_list))
          records = inventory_list(api.get(base + '/dns_records?per_page=100'))
          for tunnel in tunnels_before:
              if tunnel.get('name') not in ('opendesign', 'penpot') or tunnel['id'] == TUNNEL:
                  continue
              identity = tunnel['id']
              path = account + '/cfd_tunnel/' + identity
              receipt['legacy_tunnel_candidates'].append({'id': identity, 'name': tunnel['name']})
              try:
                  connections = inventory_list(api.get(path + '/connections'))
                  config = api.get(path + '/configurations').get('config', {})
                  ingress = inventory_list(config.get('ingress', []))
                  names = [item.get('hostname') for item in ingress if item.get('hostname')]
                  dedicated = names and all(name == HOST for name in names)
                  referenced = any(identity + '.cfargotunnel.com' == item.get('content', '').rstrip('.') for item in records)
                  if connections or not dedicated or referenced or config.get('warp-routing', {}).get('enabled'):
                      receipt['blockers'].append('LEGACY_TUNNEL_SCOPE_OR_ACTIVITY:' + identity)
                      continue
                  api.request('DELETE', path)
                  receipt['deleted_legacy_tunnels'].append(identity)
              except Failure as error:
                  receipt['blockers'].append(str(error))
          tunnels_after = inventory_list(api.get(tunnel_list))
          assert [item['id'] for item in tunnels_after] == [item['id'] for item in tunnels_before if item['id'] not in receipt['deleted_legacy_tunnels']]
          assert api.get(shared_path) == shared_before
          assert not any(item.get('hostname') == HOST for item in shared_before['config']['ingress'])
          assert active_connectors(api.get(account + '/cfd_tunnel/' + TUNNEL + '/connections')) > 0
          receipt['shared_tunnel_preserved'] = True
          receipt['unrelated_tunnels_preserved'] = True
          receipt['unrelated_cache_rulesets_preserved'] = True
          print(json.dumps(receipt, sort_keys=True, indent=2))
          PY
