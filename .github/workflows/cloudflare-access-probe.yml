name: Probe public artifact access
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove central token can download approved public source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected=super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      redirected.remove_header('Authorization')
                  return redirected
          opener=urllib.request.build_opener(Redirect())
          base='https://api.github.com/repos/TheDemonTuan/acb-transaction-webhook'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          request=urllib.request.Request(base+'/actions/runs/37202798151/artifacts', headers=headers)
          with opener.open(request,timeout=30) as response:
              artifacts=json.load(response)['artifacts']
          artifact=next(row for row in artifacts if row['name']=='verified-bundle' and not row['expired'])
          request=urllib.request.Request(base+'/actions/artifacts/'+str(artifact['id'])+'/zip', headers=headers)
          with opener.open(request,timeout=30) as response:
              archive=response.read(10485760)
          if not archive.startswith(b'PK'): raise SystemExit('Artifact download was not a ZIP archive')
          print('PASS: central GITHUB_TOKEN downloaded approved public source artifact without per-app credentials')
          PY
