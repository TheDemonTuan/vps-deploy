name: Platform verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install YAML parser and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml openssh-server
          go install github.com/rhysd/actionlint/cmd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Verify immutable migration baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/vps-deploy-baseline" 4e9674ad29112a02d2384f6542cc64644da33dea
          (cd "$RUNNER_TEMP/vps-deploy-baseline" && python3 -m unittest discover -s tests -p 'test_*.py' -v)
          (cd "$RUNNER_TEMP/vps-deploy-baseline" && bash tests/blue-green-reconcile.test.sh)
      - name: Exercise state, input and crash boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise adapted blue-green harness
        run: bash tests/blue-green-reconcile.test.sh
      - name: Exercise disposable Traefik and systemd integration
        run: sudo RUNNER_TEMP="$RUNNER_TEMP" bash tests/integration/platform-smoke.sh --migration-base "$RUNNER_TEMP/vps-deploy-baseline"
