name: Platform verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install YAML parser and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml openssh-server
          go install github.com/rhysd/actionlint/cmd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Exercise state, input and crash boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise adapted blue-green harness
        run: bash tests/blue-green-reconcile.test.sh
      - name: Exercise disposable Traefik and systemd integration
        run: sudo RUNNER_TEMP="$RUNNER_TEMP" bash tests/integration/platform-smoke.sh
