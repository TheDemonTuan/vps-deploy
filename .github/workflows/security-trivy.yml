name: Security scan and compliance gate
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
      config:
        required: true
        type: string
      scan-mode:
        required: true
        type: string # source or image
      image-ref:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject mutable platform checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CALLER_SHA: ${{ github.sha }}
          SCAN_MODE: ${{ inputs.scan-mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" ]]
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
          [[ "$SCAN_MODE" =~ ^(source|image)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate caller registration before source checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 platform/scripts/check-caller.py security-trivy.yml --preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - name: Validate checked out caller and manifest
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          python3 platform/scripts/check-caller.py security-trivy.yml
      - name: Install pinned Trivy engine
        run: |
          sudo bash platform/scripts/install-trivy.sh /usr/local/bin
      - name: Restore Trivy DB cache
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date || github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Log in to GHCR for private image scan
        if: inputs.scan-mode == 'image'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute Trivy security gate
        working-directory: source
        env:
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-reports"
          REPORT_DIR="$RUNNER_TEMP/trivy-reports"

          COMMON_OPTS=()
          if [[ -f ".trivyignore" ]]; then
            COMMON_OPTS+=(--ignorefile ".trivyignore")
          fi
          if [[ -f "trivy-secret.yaml" ]]; then
            COMMON_OPTS+=(--secret-config "trivy-secret.yaml")
          fi

          if [[ "$SCAN_MODE" == "source" ]]; then
            echo "::group::Trivy Source Vulnerability, Misconfig & Secret Gate"
            # 1. Human readable console summary
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format table \
              .

            # 2. JSON report artifact
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --format json \
              --output "$REPORT_DIR/trivy-source-${APP}.json" \
              .

            # 3. CycloneDX SBOM
            trivy fs "${COMMON_OPTS[@]}" \
              --format cyclonedx \
              --output "$REPORT_DIR/sbom-source-${APP}.cdx.json" \
              .

            # 4. Strict Gate: Fail if CRITICAL vulnerabilities or HIGH/CRITICAL secrets/misconfigs exist
            echo "Running strict source gate..."
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              .

            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln \
              --severity CRITICAL \
              --exit-code 1 \
              .
            echo "::endgroup::"
          elif [[ "$SCAN_MODE" == "image" ]]; then
            echo "::group::Trivy Immutable Image Gate for $IMAGE_REF"
            # 1. Human readable console summary
            trivy image "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format table \
              "$IMAGE_REF"

            # 2. JSON report artifact
            trivy image "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --format json \
              --output "$REPORT_DIR/trivy-image-${APP}.json" \
              "$IMAGE_REF"

            # 3. CycloneDX SBOM for exact image digest
            trivy image "${COMMON_OPTS[@]}" \
              --format cyclonedx \
              --output "$REPORT_DIR/sbom-image-${APP}.cdx.json" \
              "$IMAGE_REF"

            # 4. Strict Gate: Fail if CRITICAL vulnerabilities or HIGH/CRITICAL secrets/misconfigs exist in image
            echo "Running strict image gate..."
            trivy image "${COMMON_OPTS[@]}" \
              --scanners secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "$IMAGE_REF"

            trivy image "${COMMON_OPTS[@]}" \
              --scanners vuln \
              --severity CRITICAL \
              --exit-code 1 \
              "$IMAGE_REF"
            echo "::endgroup::"
          fi
      - name: Save Trivy DB cache
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        if: always()
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date || github.run_id }}
      - name: Upload Trivy & SBOM reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-reports-${{ inputs.app }}-${{ inputs.scan-mode }}
          path: ${{ runner.temp }}/trivy-reports/
