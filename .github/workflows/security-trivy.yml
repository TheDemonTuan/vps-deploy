name: Security scan and compliance gate
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      platform-ref:
        required: true
        type: string
      config:
        required: true
        type: string
      scan-mode:
        required: true
        type: string # source or image
      image-ref:
        required: false
        type: string
        default: ''
      image-role:
        required: false
        type: string
        default: ''
      platform:
        required: false
        type: string
        default: ''
      vuln-severity:
        required: false
        type: string
        default: 'HIGH,CRITICAL'
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ${{ inputs.scan-mode == 'image' && startsWith(inputs.image-ref, 'ghcr.io/thedemontuan/9router-cgw-runtime@sha256:') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Reject mutable platform checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CALLER_SHA: ${{ github.sha }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" ]]
          [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
          [[ "$SCAN_MODE" =~ ^(source|image)$ ]]
          [[ -z "${PLATFORM:-}" || "$PLATFORM" =~ ^[a-z0-9/_-]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: ${{ inputs.platform-ref }}
          path: platform
          persist-credentials: false
      - name: Validate caller registration before source checkout
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_ROLE: ${{ inputs.image-role }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 platform/scripts/check-caller.py security-trivy.yml --preflight
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - name: Validate checked out caller and manifest
        env:
          APP: ${{ inputs.app }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
          CONFIG: ${{ inputs.config }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF: ${{ github.ref }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_ROLE: ${{ inputs.image-role }}
        run: |
          set -euo pipefail
          python3 platform/scripts/check-caller.py security-trivy.yml
      - name: Install pinned Trivy engine
        run: |
          sudo bash platform/scripts/install-trivy.sh /usr/local/bin
      - name: Ensure Trivy cache dir exists
        run: mkdir -p ~/.cache/trivy
      - name: Restore Trivy DB cache
        id: trivy-cache
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Log in to GHCR for private image scan
        if: inputs.scan-mode == 'image'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute Trivy security gate
        working-directory: source
        env:
          SCAN_MODE: ${{ inputs.scan-mode }}
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_ROLE: ${{ inputs.image-role }}
          APP: ${{ inputs.app }}
          PLATFORM: ${{ inputs.platform }}
          VULN_SEVERITY: ${{ inputs.vuln-severity }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-reports"
          REPORT_DIR="$RUNNER_TEMP/trivy-reports"
          REPORT_APP="$APP${IMAGE_ROLE:+-$IMAGE_ROLE}"

          COMMON_OPTS=()
          if [[ -f ".trivyignore.yaml" ]]; then
            COMMON_OPTS+=(--ignorefile ".trivyignore.yaml")
          elif [[ -f ".trivyignore.yml" ]]; then
            COMMON_OPTS+=(--ignorefile ".trivyignore.yml")
          elif [[ -f ".trivyignore" ]]; then
            COMMON_OPTS+=(--ignorefile ".trivyignore")
          fi
          if [[ -f "trivy-secret.yaml" ]]; then
            COMMON_OPTS+=(--secret-config "trivy-secret.yaml")
          fi

          IMAGE_OPTS=()
          if [[ -n "${PLATFORM:-}" ]]; then
            IMAGE_OPTS+=(--platform "$PLATFORM")
          fi
          if [[ "$SCAN_MODE" == "source" ]]; then
            echo "::group::Trivy Source Vulnerability, Misconfig & Secret Gate"
            # 1. Human readable console summary
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format table \
              .

            # 2. JSON report artifact
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --format json \
              --output "$REPORT_DIR/trivy-source-${APP}.json" \
              .

            # 3. CycloneDX SBOM
            trivy fs "${COMMON_OPTS[@]}" \
              --format cyclonedx \
              --output "$REPORT_DIR/sbom-source-${APP}.cdx.json" \
              .

            # 4. Strict Gate: Fail if CRITICAL vulnerabilities or HIGH/CRITICAL secrets/misconfigs exist
            echo "Running strict source gate..."
            trivy fs "${COMMON_OPTS[@]}" \
              --scanners secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              .

            trivy fs "${COMMON_OPTS[@]}" \
              --scanners vuln \
              --severity "${VULN_SEVERITY:-HIGH,CRITICAL}" \
              --exit-code 1 \
              .
            echo "::endgroup::"
          elif [[ "$SCAN_MODE" == "image" ]]; then
            echo "::group::Trivy Immutable Image Gate for $IMAGE_REF"
            # 1. Human readable console summary
            trivy image "${COMMON_OPTS[@]}" "${IMAGE_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format table \
              "$IMAGE_REF"

            # 2. JSON report artifact
            trivy image "${COMMON_OPTS[@]}" "${IMAGE_OPTS[@]}" \
              --scanners vuln,secret,misconfig \
              --format json \
              --output "$REPORT_DIR/trivy-image-${REPORT_APP}.json" \
              "$IMAGE_REF"

            # 3. CycloneDX SBOM for exact image digest
            trivy image "${COMMON_OPTS[@]}" "${IMAGE_OPTS[@]}" \
              --format cyclonedx \
              --output "$REPORT_DIR/sbom-image-${REPORT_APP}.cdx.json" \
              "$IMAGE_REF"
            # 4. Strict Gate: Fail if CRITICAL vulnerabilities or HIGH/CRITICAL secrets/misconfigs exist in image
            echo "Running strict image gate..."
            trivy image "${COMMON_OPTS[@]}" "${IMAGE_OPTS[@]}" \
              --scanners secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "$IMAGE_REF"

            trivy image "${COMMON_OPTS[@]}" "${IMAGE_OPTS[@]}" \
              --scanners vuln \
              --severity "${VULN_SEVERITY:-HIGH,CRITICAL}" \
              --exit-code 1 \
              "$IMAGE_REF"
            if [[ "$IMAGE_REF" == ghcr.io/thedemontuan/9router-cgw-runtime@sha256:* ]]; then
              [[ "$(uname -m)" == aarch64 ]]
              metadata="$RUNNER_TEMP/cgw-browser-security"
              mkdir -m 0700 "$metadata"
              cache="cgw-security-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              docker volume create "$cache"
              trap 'docker rm -f "${cache}-init" "${cache}-metadata" >/dev/null 2>&1 || true; docker volume rm "$cache" >/dev/null 2>&1 || true' EXIT
              docker pull "$IMAGE_REF"
              docker run --rm --read-only --user 10001:10001 --cap-drop ALL \
                --name "${cache}-init" \
                --security-opt no-new-privileges:true --cpus 0.5 --memory 1g \
                --mount "type=volume,src=$cache,dst=/opt/cgw-browser" \
                --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
                --tmpfs /run:rw,nosuid,nodev,mode=0700,uid=10001,gid=10001 \
                "$IMAGE_REF" python3 scripts/install-browser.py --manifest image-build-manifest.json
              # Only SPDX metadata crosses Docker's cache boundary; no browser files on host.
              docker run --rm --read-only --network none --user 10001:10001 --cap-drop ALL \
                --name "${cache}-metadata" \
                --security-opt no-new-privileges:true --cpus 0.5 --memory 1g \
                --mount "type=volume,src=$cache,dst=/opt/cgw-browser,readonly" \
                --entrypoint bun "$IMAGE_REF" -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync("image-build-manifest.json","utf8"));process.stdout.write(fs.readFileSync(m.browser.installRoot+"/browser.spdx.json","utf8"))' \
                > "$metadata/browser.spdx.json"
              sudo bash "$GITHUB_WORKSPACE/platform/scripts/install-grype.sh" /usr/local/bin
              python3 "$GITHUB_WORKSPACE/platform/scripts/scan-browser.py" \
                --sbom "$metadata/browser.spdx.json" \
                --report "$REPORT_DIR/grype-browser-${APP}.json"
              docker volume rm "$cache"
              trap - EXIT
            fi
            echo "::endgroup::"
          fi
      - name: Save Trivy DB cache
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        if: always() && steps.trivy-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
      - name: Upload Trivy & SBOM reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-reports-${{ inputs.app }}-${{ inputs.scan-mode }}${{ inputs.image-role && format('-{0}', inputs.image-role) || '' }}
          path: ${{ runner.temp }}/trivy-reports/
          if-no-files-found: ignore
