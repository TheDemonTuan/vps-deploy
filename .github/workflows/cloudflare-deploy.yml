name: Central Cloudflare deploy
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main, feat/cloudflare-central-deploy]
    paths: [cloudflare/**, .github/workflows/cloudflare-deploy.yml]
  workflow_dispatch:
    inputs:
      app:
        description: Registered application
        type: choice
        options: [all, acb, uptimeflare]
        default: all
      mode:
        description: Survey is read-only; restore-routes uses original central receipt snapshots
        type: choice
        options: [survey, check, publish, bootstrap, rollback, cutover, restore-routes]
        default: survey
      source_run_id:
        description: Successful source CI run; for restore-routes, original central cutover run
        type: string
        default: ''
      sha:
        description: Expected source SHA for exact-version rollback
        type: string
        default: ''
      version_id:
        description: Exact ACB or uptimeflare web rollback UUID
        type: string
        default: ''
      monitor_version_id:
        description: Exact uptimeflare monitoring rollback UUID (paired with web)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify trusted controller and adapters without production credentials
        run: |
          python3 -m unittest discover -s cloudflare/tests -p 'test_*.py' -v
          python3 -m unittest discover -s cloudflare/acb/tests -p 'test_*.py' -v
          node --test cloudflare/tests/test_uptimeflare_wrappers.mjs
  resolve:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: select
        name: Resolve successful CI from platform-registered repositories
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_APP: ${{ inputs.app || 'all' }}
          REQUEST_MODE: ${{ inputs.mode || (github.event_name == 'push' && 'survey') || 'publish' }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REQUEST_SHA: ${{ inputs.sha }}
          VERSION_ID: ${{ inputs.version_id }}
          MONITOR_VERSION_ID: ${{ inputs.monitor_version_id }}
          SCHEDULED: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/'selection.json'
          command=['python3','cloudflare/deploy.py','resolve','--app',os.environ['REQUEST_APP'],'--mode',os.environ['REQUEST_MODE'],'--output',str(output)]
          for variable, flag in [('SOURCE_RUN_ID','--source-run-id'),('REQUEST_SHA','--sha'),('VERSION_ID','--version-id'),('MONITOR_VERSION_ID','--monitor-version-id')]:
              if os.environ.get(variable): command += [flag,os.environ[variable]]
          if os.environ['SCHEDULED']=='true': command += ['--scheduled']
          subprocess.run(command,check=True)
          value=json.loads(output.read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('matrix='+json.dumps(value,separators=(',',':'))+'\n')
              stream.write('count='+str(len(value['include']))+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('## Central source verification\n\n')
              if not value['include']: stream.write('No eligible new registered CI artifact. No production action.\n')
              for item in value['include']:
                  stream.write(f"- {item['app']}: {item['mode']}; source run {item['run_id']}; SHA `{item['sha']}`\n")
          PY
  deploy:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cloudflare-${{ matrix.app }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install pinned platform tooling without source code or credentials
        run: npm ci --prefix cloudflare --ignore-scripts
      - name: Install actual public-browser verifier without deployment credentials
        if: matrix.app == 'uptimeflare' && matrix.mode != 'survey'
        run: node cloudflare/node_modules/playwright/cli.js install --with-deps chromium
      - name: Invoke only the platform-owned deployment adapter
        env:
          SELECTION: ${{ toJSON(matrix) }}
          REQUEST_APP: ${{ matrix.app }}
          REQUEST_MODE: ${{ matrix.mode }}
          VERSION_ID: ${{ inputs.version_id }}
          MONITOR_VERSION_ID: ${{ inputs.monitor_version_id }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPTIMEFLARE_D1_ID: ${{ vars.UPTIMEFLARE_D1_ID }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          selection=Path(os.environ['RUNNER_TEMP'])/'execute-selection.json'
          selection.write_text(os.environ['SELECTION'])
          selection.chmod(0o600)
          command=['python3','cloudflare/deploy.py','execute','--app',os.environ['REQUEST_APP'],'--mode',os.environ['REQUEST_MODE'],'--selection',str(selection),'--output',os.environ['RUNNER_TEMP']+'/receipt.json']
          for variable, flag in [('VERSION_ID','--version-id'),('MONITOR_VERSION_ID','--monitor-version-id')]:
              if os.environ.get(variable): command += [flag,os.environ[variable]]
          subprocess.run(command,check=True)
          PY
      - name: Publish sanitized deployment receipt
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'receipt.json'
          if path.exists():
              value=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
                  stream.write('## Cloudflare receipt\n\n```json\n'+json.dumps(value,indent=2,sort_keys=True)+'\n```\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cloudflare-receipt-${{ matrix.app }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/readiness.json
            ${{ runner.temp }}/*routes.json
          retention-days: 30
          if-no-files-found: warn
