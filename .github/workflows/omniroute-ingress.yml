name: OmniRoute Cloudflare ingress
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Survey first; apply only after verifying the enrolled origin
        type: choice
        required: true
        options: [survey, apply]
permissions:
  contents: read
concurrency:
  group: cloudflare-tunnel-oracle-main
  cancel-in-progress: false
jobs:
  ingress:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.operation == 'apply' && 'platform-admin' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify scoped ingress state transitions without credentials
        run: python3 -m unittest discover -s cloudflare/tests -p test_omniroute_ingress.py -v
      - name: Enroll only OmniRoute hostnames
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATION: ${{ inputs.operation }}
        run: python3 cloudflare/omniroute_ingress.py --operation "$OPERATION"
