name: Deploy registered app on VPS
description: Environment-scoped, pinned deployment transport
inputs:
  app:
    description: Registered app ID
    required: true
  host:
    description: Registered host ID
    required: true
  operation:
    description: deploy, status, rollback, or reconcile
    required: true
  component:
    description: app, rtk, or registered cgw
    required: true
  source-sha:
    description: Immutable caller source revision
    required: true
  platform-ref:
    description: Immutable platform action and engine revision
    required: true
  config:
    description: App manifest path
    default: .deploy/app.yml
  image-ref:
    description: Immutable single-image digest for non-Penpot deploys
    default: ''
  images:
    description: Exact JSON map of four immutable digests for Penpot deploys
    default: ''
runs:
  using: composite
  steps:
    - name: Reject mutable platform checkout
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        PLATFORM_REF: ${{ inputs.platform-ref }}
        ACTION_REF: ${{ github.action_ref }}
        CALLER_SHA: ${{ github.sha }}
        APP: ${{ inputs.app }}
        HOST: ${{ inputs.host }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$CALLER_SHA" ]]
        [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ && "$ACTION_REF" == "$PLATFORM_REF" ]]
        [[ "$APP" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
        [[ "$HOST" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: TheDemonTuan/vps-deploy
        ref: ${{ inputs.platform-ref }}
        path: platform
        persist-credentials: false
    - name: Validate registered caller before source checkout
      shell: bash
      env:
        APP: ${{ inputs.app }}
        HOST: ${{ inputs.host }}
        CALLER_REPO: ${{ github.repository }}
        CALLER_REF: ${{ github.ref }}
        CALLER_SHA: ${{ github.sha }}
        ACTION_REF: ${{ github.action_ref }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        PLATFORM_REF: ${{ inputs.platform-ref }}
        CONFIG: ${{ inputs.config }}
        OPERATION: ${{ inputs.operation }}
        COMPONENT: ${{ inputs.component }}
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y python3-yaml
        python3 platform/scripts/check-caller.py deploy/action.yml --preflight
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.source-sha }}
        path: source
        persist-credentials: false
    - name: Validate immutable caller and manifest
      shell: bash
      env:
        APP: ${{ inputs.app }}
        HOST: ${{ inputs.host }}
        CALLER_REPO: ${{ github.repository }}
        CALLER_REF: ${{ github.ref }}
        CALLER_SHA: ${{ github.sha }}
        ACTION_REF: ${{ github.action_ref }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        PLATFORM_REF: ${{ inputs.platform-ref }}
        CONFIG: ${{ inputs.config }}
        OPERATION: ${{ inputs.operation }}
        COMPONENT: ${{ inputs.component }}
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGES: ${{ inputs.images }}
      run: python3 platform/scripts/check-caller.py deploy/action.yml
    - name: Submit request and verify strict status
      shell: bash
      working-directory: source
      env:
        APP: ${{ inputs.app }}
        HOST: ${{ inputs.host }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        PLATFORM_REF: ${{ inputs.platform-ref }}
        CONFIG: ${{ inputs.config }}
        OPERATION: ${{ inputs.operation }}
        COMPONENT: ${{ inputs.component }}
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGES: ${{ inputs.images }}
        DEPLOY_HOST: ${{ env.DEPLOY_HOST || '' }}
        DEPLOY_PORT: ${{ env.DEPLOY_PORT || '' }}
        DEPLOY_USER: ${{ env.DEPLOY_USER || '' }}
      run: |
        set -euo pipefail
        umask 077
        sshdir="$(mktemp -d)"
        trap 'rm -rf "$sshdir"' EXIT
        test -n "${DEPLOY_SSH_KEY:-}"
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$sshdir/key"
        args=(--app "$APP" --host "$HOST" --operation "$OPERATION" --component "$COMPONENT"
              --source-sha "$SOURCE_SHA" --platform-ref "$PLATFORM_REF" --config "$CONFIG"
              --request-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${COMPONENT}")
        if [[ "$OPERATION" == deploy ]]; then
          if [[ "$APP" == penpot ]]; then args+=(--images "$IMAGES"); else args+=(--image "$IMAGE_REF"); fi
        fi
        DEPLOY_KEY_FILE="$sshdir/key" python3 ../platform/scripts/ssh-request.py "${args[@]}"
