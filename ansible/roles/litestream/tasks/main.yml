# platform/litestream: files and data volume only. Which profile runs (primary or the follower of
# the lease writer) is platform/peer/role.sh's decision, started by platform-role.service.
- name: Litestream directory
  ansible.builtin.file:
    path: /opt/platform/litestream
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Litestream files
  ansible.builtin.copy:
    src: "{{ platform_src }}/litestream/{{ item }}"
    dest: "/opt/platform/litestream/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [compose.yml, primary.yml, replica.yml]

- name: R2 credentials (whom a replica follows is role.sh's, in litestream-primary.env)
  ansible.builtin.include_role:
    name: shared_secret
  vars:
    secret:
      dest: /etc/platform/litestream.env
      keep: '^(?!PRIMARY_)'

# Each R2 token allows only the nodes' IPs; a node missing there still replicates (SFTP) and only
# fails once it becomes the writer (backups) or serves media. Read-only, so it runs in --check too.
- name: R2 answers this node (tokens litestream-mc-hub-db, mc-hub-media-nodes)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      v() { sed -n "s/^$1=//p" "$2" | head -1 | tr -d "\"'"; }
      image=$(sed -n '/^ *image: rclone\/rclone/{s/^ *image: //p;q}' /opt/platform/litestream/compose.yml)
      # Keys through the environment (docker run -e NAME), never on a command line.
      lsf() {
        RCLONE_CONFIG_R2_ENDPOINT=$1 RCLONE_CONFIG_R2_ACCESS_KEY_ID=$2 RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=$3 \
          docker run --rm -e HOME=/tmp -e RCLONE_CONFIG_R2_TYPE=s3 -e RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
          -e RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true -e RCLONE_CONFIG_R2_ENDPOINT -e RCLONE_CONFIG_R2_ACCESS_KEY_ID \
          -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY "$image" lsf "r2:$4" --max-depth 1 >/dev/null 2>&1 ||
          { echo "R2 bucket $4 refuses this node: add {{ ansible_host }} to the IP filter of account token $5" >&2; return 1; }
      }
      l=/etc/platform/litestream.env m=/etc/vps-deploy/apps/mc-hub-api/runtime.env
      [ ! -e $l ] || lsf "https://$(v R2_ACCOUNT_ID $l).r2.cloudflarestorage.com" "$(v LITESTREAM_ACCESS_KEY_ID $l)" \
        "$(v LITESTREAM_SECRET_ACCESS_KEY $l)" mc-hub-db litestream-mc-hub-db
      # The app's runtime env comes with its enrollment (README "Add a node"), later than this role.
      [ ! -e $m ] || lsf "$(v MEDIA_S3_ENDPOINT $m)" "$(v MEDIA_S3_ACCESS_KEY_ID $m)" "$(v MEDIA_S3_SECRET_ACCESS_KEY $m)" \
        "$(v MEDIA_S3_BUCKET $m)" mc-hub-media-nodes
  check_mode: false
  changed_when: false

- name: Look for the data volume
  ansible.builtin.command: docker volume inspect -f '{{ "{{" }}.Mountpoint{{ "}}" }}' mc-hub-api-data
  register: litestream_volume
  check_mode: false
  changed_when: false
  failed_when: false

- name: Create the data volume (mc-hub-api and Litestream run as 1000:1000)
  when: litestream_volume.rc != 0
  ansible.builtin.shell: chown 1000:1000 "$(docker volume create mc-hub-api-data >/dev/null && docker volume inspect -f '{{ "{{" }}.Mountpoint{{ "}}" }}' mc-hub-api-data)"
  changed_when: true
