# reloaded starts a unit that is not running (a new node, a failed start).
- name: Reload crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded

- name: Restart crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: restarted

- name: Restart firewall bouncer
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    state: restarted

# Only where it runs (the LAPI node): elsewhere peer.sh keeps it stopped.
- name: Restart controller
  ansible.builtin.command: systemctl try-restart crowdsec-telegram-controller.service  # noqa: command-instead-of-module
  changed_when: true

# Its loop runs the lapi.sh it started with.
- name: Restart copy publisher
  ansible.builtin.command: systemctl try-restart crowdsec-follow-position.service  # noqa: command-instead-of-module
  changed_when: true
