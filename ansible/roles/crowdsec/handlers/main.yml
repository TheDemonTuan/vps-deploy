# reloaded starts a unit that is not running (a new node, a failed start).
- name: Reload crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded

- name: Restart crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: restarted

- name: Restart firewall bouncer
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    state: restarted
