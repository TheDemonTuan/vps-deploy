# Every edge node's platform layer (platform/README.md "Add a node"), from this repository.
#   ansible-playbook site.yml --check --diff     what would change, on every node
#   ansible-playbook site.yml                    apply (one node: --limit oracle-n3; a part: --tags sync)
# Apps are enrolled by the installer and deployed by their CI; app routes in
# /opt/platform/edge/dynamic/<app>.yml belong to the deploy engine and are never touched here.
# sync before crowdsec: the LAPI tunnel pins the LAPI node's host key from /etc/platform/known_hosts.
# monitor before edge: the hub's Compose project creates edge-monitor, which Traefik joins.
# Run without --limit when a node joins or leaves: every node's fleet files list all of them.
- name: Edge nodes
  hosts: edge
  roles:
    - {role: base, tags: base}
    - {role: docker, tags: docker}
    - {role: sync, tags: sync}
    - {role: crowdsec, tags: crowdsec}
    - {role: monitor, tags: monitor}
    - {role: edge, tags: edge}
    - {role: litestream, tags: litestream}
    - {role: peer, tags: peer}
    - {role: apps, tags: apps}
