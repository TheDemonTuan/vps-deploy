services:
  opendesign-single:
    image: ${IMAGE_REF:?IMAGE_REF must be provided}
    container_name: opendesign-single
    user: "1001:1001"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=256m"
    restart: unless-stopped
    expose:
      - "7456"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
      OD_DATA_DIR: /app/.od
      OD_BIND_HOST: "0.0.0.0"
      OD_PORT: "7456"
      OD_WEB_PORT: "7456"
      OD_DEPLOYMENT_SLOT: single
      OD_API_TOKEN: ${OD_API_TOKEN:?OD_API_TOKEN must be set}
      OD_ALLOWED_ORIGINS: ${OD_ALLOWED_ORIGINS:-https://design.tuannguyenviet.site}
    volumes:
      - opendesign-data:/app/.od:rw
    networks:
      - edge
      - opendesign-egress
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7456/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${OPEN_DESIGN_MEM_LIMIT:-768M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge-opendesign}
  opendesign-egress:
    driver: bridge

volumes:
  opendesign-data:
    external: true
    name: opendesign-data
