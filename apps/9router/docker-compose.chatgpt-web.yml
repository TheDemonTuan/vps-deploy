# Optional HTTP integration; runtime lifecycle belongs to the separate 9router-cgw project.
services:
  9router-blue:
    group_add: ["10001"]
    environment: &cgw-env
      CHATGPT_WEB_RUNTIME_URL: http://cgw-runtime:17841
      CHATGPT_WEB_RUNTIME_TOKEN_FILE: /run/secrets/cgw-data-token
      CHATGPT_WEB_RUNTIME_ADMIN_TOKEN_FILE: /run/secrets/cgw-admin-token
      CHATGPT_WEB_CLIENT_KEYS_FILE: /run/secrets/cgw-client-keys.json
    volumes: &cgw-secrets
      - ${CGW_CONFIG_DIR:?}/cgw-data-token:/run/secrets/cgw-data-token:ro
      - ${CGW_CONFIG_DIR}/cgw-admin-token:/run/secrets/cgw-admin-token:ro
      - ${CGW_CONFIG_DIR}/cgw-client-keys.json:/run/secrets/cgw-client-keys.json:ro
    networks:
      - edge
      - internal
      - rtk
      - cgw
  9router-green:
    group_add: ["10001"]
    environment: *cgw-env
    volumes: *cgw-secrets
    networks:
      - edge
      - rtk
      - internal
      - cgw
networks:
  cgw:
    name: ${CGW_NETWORK:?}
    external: true
