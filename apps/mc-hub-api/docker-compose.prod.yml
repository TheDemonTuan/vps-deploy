x-runtime: &runtime
  image: ${IMAGE_REF:?IMAGE_REF must be an immutable image digest}
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  networks:
    edge: {}
    # Outbound only: Cloudflare Turnstile siteverify (captcha) and the R2 media bucket (S3 API).
    egress: {gw_priority: 1}
  expose: ["8080"]
  # Blue and green share one SQLite (WAL) database and media store during cutover.
  volumes:
    - data:/data
  stop_grace_period: 60s
  healthcheck:
    test: [CMD, wget, -qO-, "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 10s
  # Image uploads decode up to 50 MP in memory.
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-environment: &environment
  DATA_DIR: /data
  # The site's domain: mc-hub's api_host in hosts/oracle-main.yml (a test keeps them equal).
  SITE_URL: https://thedemontuan.dev
  # Only cloudflared reaches Traefik (tunnel-only), so CF-Connecting-IP is authoritative.
  TRUST_CF_CONNECTING_IP: "1"
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY required}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET required}
  # primary on the registry's `host` (the single writer); replica on replica_hosts: a read-only
  # copy that the node's Litestream follower (platform/litestream) keeps current. After a
  # failover the volume's `role` file (platform/peer/role.sh) takes precedence.
  DB_ROLE: ${NODE_ROLE:?NODE_ROLE is set by the deploy engine}
  # Verifies the reader's address on writes the edge queued and replays (cloudflare/edge-lb).
  EDGE_REPLAY_KEY: ${EDGE_REPLAY_KEY:-}
  # Uploads are also kept in this R2 bucket (S3 API), so any node can serve them.
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?MEDIA_S3_ENDPOINT required}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?MEDIA_S3_BUCKET required}
  MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:?MEDIA_S3_ACCESS_KEY_ID required}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:?MEDIA_S3_SECRET_ACCESS_KEY required}
services:
  mc-hub-api-blue:
    <<: *runtime
    container_name: mc-hub-api-blue
    environment:
      <<: *environment
      DEPLOY_SLOT: blue
  mc-hub-api-green:
    <<: *runtime
    container_name: mc-hub-api-green
    environment:
      <<: *environment
      DEPLOY_SLOT: green
volumes:
  data:
    name: mc-hub-api-data
networks:
  # Internal: inbound from Traefik only.
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge-mc-hub-api}
  egress:
    name: mc-hub-api-egress
    labels: {vps-deploy.app: mc-hub-api}
